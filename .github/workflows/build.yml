# Builds slope-angle cells from USGS 3DEP and deploys them to Cloudflare Pages (Direct Upload,
# project slope-extracts, https://slope.timzander.com). Spec: openspec/specs/slope-extract.
#
# Each run builds the cells of regions.json that the live site lacks, built with another recipe, or
# built over 300 days ago; at most 48 per run, three per job. With nothing to build a run is the plan
# job alone.
#
# Security model (ADR 0003, ADR 0007):
# - Triggers are `schedule` and `workflow_dispatch` with no inputs: nothing a fork, a pull request or a
#   run's caller can steer.
# - Every job has `contents: read` only. The Cloudflare token and account id live in the GitHub
#   Environment `pages-production` (deployments from `main` only). Only the deploy job uses that
#   Environment, and only its last step (wrangler) is given them, through `env:`.
# - Only GitHub's checkout/upload-artifact/download-artifact, each pinned by commit SHA. Wrangler and its
#   dependencies come from deploy/package-lock.json via `npm ci --ignore-scripts`, in a step with no
#   secret. No `setup-python`, no expression inside `run:`.
# - Nothing runs until the owner sets the repository variable BUILD_ENABLED to true, after the
#   Cloudflare project and the Environment's secrets exist (docs/setup.md, ADR 0008).
# - Plan and build jobs read third-party data with no secret. Build-job wheels are hash-pinned. The
#   deploy job checks every file they upload, and every file it reads back from the live site, before
#   the wrangler step runs.
name: build

on:
  schedule:
    - cron: "41 */3 * * *" # every 3 hours; a run with nothing to build ends after the plan job
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slope-extract
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ vars.BUILD_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      count: ${{ steps.plan.outputs.count }}
      had_manifest: ${{ steps.plan.outputs.had_manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plan the cells to build
        id: plan
        run: python3 -m slope_extracts.site >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: ${{ needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        cells: ${{ fromJSON(needs.plan.outputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned packages
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --require-hashes --only-binary=:all: --no-deps -r requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -c "import rasterio; print('rasterio', rasterio.__version__, 'GDAL', rasterio.__gdal_version__)"
      - name: Build the cells
        env:
          CELLS: ${{ matrix.cells }}
          INDEX: ${{ strategy.job-index }}
        # CELLS is the plan's own output, "<region>/<cell>" items split on spaces.
        run: |
          read -r -a items <<< "$CELLS"
          "$RUNNER_TEMP/venv/bin/python" -m slope_extracts.build_cell "${items[@]}" --out "$RUNNER_TEMP/out/cells-$INDEX"
      # Uploaded even when a cell failed: the others' files are good, and the failed one keeps its
      # previous files. The job still ends red.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cells-${{ strategy.job-index }}
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: [plan, build]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: pages-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No github-token input: an artifact of this run is read with the runner's own artifact token.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cells-*
          path: ${{ runner.temp }}/artifacts
      # Checks this run's cells against the plan, reads the rest of the site back from the live site
      # (checked too) and writes the whole site to _site/. Holds no credential.
      - name: Assemble the site
        id: site
        env:
          PLAN_JOBS: ${{ needs.plan.outputs.jobs }}
          PLAN_HAD_MANIFEST: ${{ needs.plan.outputs.had_manifest }}
        run: python3 -m slope_extracts.publish assemble --artifacts "$RUNNER_TEMP/artifacts" --out _site
      # Wrangler and everything under it come from deploy/package-lock.json (integrity hashes), with
      # no install scripts, in a step that holds no secret.
      - name: Install wrangler
        if: steps.site.outputs.changed == 'true'
        working-directory: deploy
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          ./node_modules/.bin/wrangler --version
      # The only step given the Cloudflare credentials. Direct Upload sends only files whose content
      # changed, so a run uploads its own cells, not the whole site.
      - name: Deploy to Pages
        if: steps.site.outputs.changed == 'true'
        working-directory: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: ./node_modules/.bin/wrangler pages deploy ../_site --project-name=slope-extracts --branch=main --commit-dirty=true
